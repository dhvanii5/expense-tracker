services:
  expense-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: expense-backend:latest
    container_name: expense-backend
    restart: unless-stopped
    ports:
      - "${PORT:-9002}:9002"
    environment:
      HOST: "0.0.0.0"
      PORT: "9002"
      CHROMA_DB_PATH: "/data/finance_memory"
      LLAMA_SERVER_URL: "http://host.docker.internal:8080"
      LLAMA_SERVER_MODEL: "qwen3b-dhvani-q8_0.gguf"
      LLAMA_SERVER_EMBEDDINGS_URL: "http://host.docker.internal:8080/embedding"
      LLAMA_SERVER_COMPLETIONS_URL: "http://host.docker.internal:8080/completion"
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9002/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  chroma-data:
    driver: local
